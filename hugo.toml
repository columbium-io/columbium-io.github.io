baseURL = "https://columbium.io/"
languageCode = "en-us"
title = "Columbium Technologies"
theme = "PaperMod"

enableRobotsTXT = true
buildDrafts   = false
buildFuture   = false

[minify]
  disableXML  = true
  minifyOutput = true

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    noClasses = false
    style     = "dracula"

[params]
  description   = "AI builds fast. We prove it works. Columbium is an AI start-up: senior engineers direct AI agents to build production software in weeks, with the tests that prove it."
  author        = "Columbium Technologies"
  defaultTheme  = "auto"
  ShowReadingTime       = true
  ShowShareButtons      = false
  ShowPostNavLinks      = true
  ShowBreadCrumbs       = false
  ShowCodeCopyButtons   = true
  ShowRssButtonInSectionTermList = false
  ShowFullTextinRSS     = false
  hideSummary   = false
  comments      = false
  mainSections  = ["posts"]
#  [params.footer]
#    text    = "hello"

  [params.label]
    text      = ""
    icon      = "/logo.png"
    iconHeight = 40

  [params.homeInfoParams]
    Eyebrow = "AI-native software engineering"
    Title   = "AI builds fast.<br><span class=\"accent\">We prove it works.</span>"
    Content = """
Columbium is an AI start-up. Senior engineers direct AI agents to build production software in weeks. \
Each system ships with the tests that prove it works.
"""

  [[params.socialIcons]]
    name = "github"
    url  = "https://github.com/columbium-io"

  [[params.socialIcons]]
    name = "email"
    url  = "mailto:hello@columbium.io"

[outputs]
  home    = ["HTML", "RSS", "JSON"]
  page    = ["HTML"]
  section = ["HTML", "RSS"]

[[menus.main]]
  identifier = "work"
  name       = "Work"
  url        = "/work/"
  weight     = 5

[[menus.main]]
  identifier = "about"
  name       = "About"
  url        = "/about/"
  weight     = 20

[[menus.main]]
  identifier = "contact"
  name       = "Start a project"
  url        = "mailto:hello@columbium.io"
  weight     = 30
