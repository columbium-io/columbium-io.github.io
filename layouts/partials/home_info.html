{{- with site.Params.homeInfoParams }}
<section class="hero">
  <div class="hero-text">
    {{- with .Eyebrow }}<p class="eyebrow">{{ . }}</p>{{ end }}
    <h1>{{ .Title | markdownify }}</h1>
    <div class="hero-sub">{{ .Content | $.Page.RenderString (dict "display" "block") }}</div>
    <div class="hero-cta">
      <a class="btn" href="mailto:hello@columbium.io">Start a project →</a>
      <a class="btn btn-ghost" href="{{ "work/" | relURL }}">See our work</a>
    </div>
  </div>
  <div class="hero-art" aria-hidden="true">{{ partial "canyon.html" . }}</div>
</section>
{{- end -}}
